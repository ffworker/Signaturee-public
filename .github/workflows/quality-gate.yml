name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This does not claim Linux generation support: it tests only the shared
  # Node application and static frontend on an Ubuntu CI runner.
  linux-node-compatibility:
    name: Linux Node/backend compatibility (not a Linux release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Frontend JavaScript syntax
        run: |
          node --check frontend/generate-v2.js
          node --check frontend/admin-v2.js
          node --check frontend/login.js
          node --check frontend/self-service.js
      - name: Backend configuration syntax
        run: node backend/server.js --check
      - name: Portable backend tests (mocked AD/PowerShell only)
        run: npm run test:backend

  windows-quality-gate:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Frontend syntax
        run: |
          node --check frontend/generate-v2.js
          node --check frontend/admin-v2.js
          node --check frontend/login.js
          node --check frontend/self-service.js

      - name: Backend configuration
        run: node backend/server.js --check

      - name: Backend tests
        run: npm run test:backend

      - name: Ensure Pester
        shell: powershell
        run: |
          if (-not (Get-Command Invoke-Pester -ErrorAction SilentlyContinue)) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: PowerShell tests
        shell: powershell
        run: Invoke-Pester -Path tests -CI

      - name: Build and inspect Windows ZIP
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signaturee-artifacts'
          $files = @(.\scripts\package-windows.ps1 -OutputDirectory $dir)
          $zip = $files[-1]
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw 'Packaging did not create the expected ZIP.'
          }
          $unpack = Join-Path $env:RUNNER_TEMP 'signaturee-package-smoke'
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack
          $releaseDir = @(Get-ChildItem -LiteralPath $unpack -Directory)
          if ($releaseDir.Count -ne 1) { throw 'ZIP must have exactly one top-level directory.' }
          $top = $releaseDir[0].FullName
          foreach ($relative in @('README.md', '.env.example', 'package-lock.json',
            'GenerateSignatures.ps1', 'backend\server.js', 'frontend\login.html',
            'scripts\install-backend-task.ps1', 'scripts\install-frontend-task.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $top $relative))) {
              throw "Missing Windows release file: $relative"
            }
          }
          foreach ($private in @('.env', 'config\secrets.env', 'config\users.csv',
            'config\templates', 'generatedsignatures', 'Logs', 'node_modules')) {
            if (Test-Path -LiteralPath (Join-Path $top $private)) {
              throw "Private/runtime path unexpectedly shipped: $private"
            }
          }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 |
            Format-Table Hash, Path -AutoSize

      - name: Attach test ZIP (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-win-${{ github.sha }}
          path: ${{ runner.temp }}\signaturee-artifacts\*.zip
          if-no-files-found: error
          retention-days: 7

