name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This does not claim Linux generation support: it tests only the shared
  # Node application and static frontend on an Ubuntu CI runner.
  linux-node-compatibility:
    name: Linux Node/backend compatibility (not a Linux release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Frontend JavaScript syntax
        run: |
          node --check frontend/generate-v2.js
          node --check frontend/admin-v2.js
          node --check frontend/login.js
          node --check frontend/self-service.js
      - name: Backend configuration syntax
        run: node backend/server.js --check
      - name: Portable backend tests (mocked AD/PowerShell only)
        run: npm run test:backend

  windows-quality-gate:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Frontend syntax
        run: |
          node --check frontend/generate-v2.js
          node --check frontend/admin-v2.js
          node --check frontend/login.js
          node --check frontend/self-service.js

      - name: Backend configuration
        run: node backend/server.js --check

      - name: Backend tests
        run: npm run test:backend

      - name: Ensure Pester
        shell: powershell
        run: |
          if (-not (Get-Command Invoke-Pester -ErrorAction SilentlyContinue)) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: PowerShell tests
        shell: powershell
        run: Invoke-Pester -Path tests -CI

      - name: Build, reproduce and inspect Windows ZIP
        shell: powershell
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signaturee-artifacts'
          $first = Join-Path $dir 'first'
          $second = Join-Path $dir 'second'
          New-Item -ItemType Directory -Force -Path $first, $second | Out-Null
          $firstFiles = @(.\scripts\package-windows.ps1 -OutputDirectory $first -Ref $env:RELEASE_REVISION)
          $secondFiles = @(.\scripts\package-windows.ps1 -OutputDirectory $second -Ref $env:RELEASE_REVISION)
          $zip = $firstFiles[-1]
          $zip2 = $secondFiles[-1]
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or
              -not (Test-Path -LiteralPath $zip2 -PathType Leaf)) {
            throw 'Reproducible packaging did not create both expected ZIPs.'
          }
          $hash1 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $hash2 = (Get-FileHash -LiteralPath $zip2 -Algorithm SHA256).Hash
          if ($hash1 -ne $hash2) {
            throw "ZIP is not reproducible: $hash1 versus $hash2"
          }
          $publishedZip = Join-Path $dir (Split-Path -Leaf $zip)
          Copy-Item -LiteralPath $zip -Destination $publishedZip
          $unpack = Join-Path $env:RUNNER_TEMP 'signaturee-package-smoke'
          Expand-Archive -LiteralPath $publishedZip -DestinationPath $unpack
          $releaseDir = @(Get-ChildItem -LiteralPath $unpack -Directory)
          if ($releaseDir.Count -ne 1) { throw 'ZIP must have exactly one top-level directory.' }
          $top = $releaseDir[0].FullName
          foreach ($relative in @('README.md', '.env.example', 'package-lock.json',
            'GenerateSignatures.ps1', 'backend\server.js', 'frontend\login.html',
            'scripts\install-backend-task.ps1', 'scripts\install-frontend-task.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $top $relative))) {
              throw "Missing Windows release file: $relative"
            }
          }
          foreach ($private in @('.env', 'config\secrets.env', 'config\users.csv',
            'config\templates', 'generatedsignatures', 'Logs', 'node_modules')) {
            if (Test-Path -LiteralPath (Join-Path $top $private)) {
              throw "Private/runtime path unexpectedly shipped: $private"
            }
          }
          $hash1 + '  ' + (Split-Path -Leaf $publishedZip) |
            Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Encoding ASCII
          @('revision=' + $env:RELEASE_REVISION,
            'zip=' + (Split-Path -Leaf $publishedZip),
            'sha256=' + $hash1) |
            Set-Content -LiteralPath (Join-Path $dir 'build-metadata.txt') -Encoding ASCII

      - name: Attach test ZIP and build evidence (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-win-${{ github.sha }}
          path: ${{ runner.temp }}\signaturee-artifacts\*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Attach checksum and revision evidence
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-win-${{ github.sha }}-evidence
          path: |
            ${{ runner.temp }}\signaturee-artifacts\SHA256SUMS.txt
            ${{ runner.temp }}\signaturee-artifacts\build-metadata.txt
          if-no-files-found: error
          retention-days: 7

