name: publish-windows-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable vN.N.N tag to publish (never created here)
        required: true
        type: string
      revision:
        description: Exact 40-character commit already tested by quality-gate
        required: true
        type: string
      changelog_url:
        description: Reviewed changelog or release-notes URL
        required: true
        type: string
      manual_evidence_url:
        description: Reviewed clean-install/upgrade/rollback and Classic Outlook evidence URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-windows-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact approved Windows artifact
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment:
      name: windows-release
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed publisher implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate exact tag and successful quality run
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVISION: ${{ inputs.revision }}
          CHANGELOG_URL: ${{ inputs.changelog_url }}
          MANUAL_EVIDENCE_URL: ${{ inputs.manual_evidence_url }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Publishing is allowed only from main' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_tag must be exactly vN.N.N' >&2; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'revision must be a full 40-character commit ID' >&2; exit 1; }
          [[ "$CHANGELOG_URL" =~ ^https:// ]] || { echo 'changelog_url must be an HTTPS URL' >&2; exit 1; }
          [[ "$MANUAL_EVIDENCE_URL" =~ ^https:// ]] || { echo 'manual_evidence_url must be an HTTPS URL' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing mutation or replacement" >&2
            exit 1
          fi

          ref_json=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")
          tag_sha=$(jq -r '.object.sha' <<<"$ref_json")
          tag_type=$(jq -r '.object.type' <<<"$ref_json")
          if [[ "$tag_type" == tag ]]; then
            tag_json=$(gh api "repos/$GH_REPO/git/tags/$tag_sha")
            tag_sha=$(jq -r '.object.sha' <<<"$tag_json")
            tag_type=$(jq -r '.object.type' <<<"$tag_json")
          fi
          [[ "$tag_type" == commit && "$tag_sha" == "$REVISION" ]] || {
            echo "Tag $RELEASE_TAG does not resolve to requested revision" >&2
            exit 1
          }

          ancestry=$(gh api "repos/$GH_REPO/compare/$REVISION...main" --jq '.status')
          [[ "$ancestry" == ahead || "$ancestry" == identical ]] || {
            echo "Requested revision is not an ancestor of main" >&2
            exit 1
          }

          runs=$(gh api "repos/$GH_REPO/actions/workflows/quality-gate.yml/runs?head_sha=$REVISION&branch=main&event=push&status=success&per_page=100")
          run_id=$(RUNS="$runs" python3 - <<'PY'
          import json, os, sys
          revision = os.environ["REVISION"]
          for run in json.loads(os.environ["RUNS"])["workflow_runs"]:
              if (run.get("head_sha") == revision and run.get("conclusion") == "success"
                      and run.get("event") == "push"
                      and run.get("head_branch") == "main"
                      and run.get("path") == ".github/workflows/quality-gate.yml"):
                  print(run["id"])
                  break
          PY
          )
          [[ -n "$run_id" ]] || {
            echo 'No successful push quality-gate run for exact revision on main' >&2
            exit 1
          }
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact quality artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.validate.outputs.run_id }}
          REVISION: ${{ inputs.revision }}
          STAGING_DIR: release-artifacts
        run: scripts/verify-windows-release-artifacts.sh

      - name: Create release from pre-existing exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVISION: ${{ inputs.revision }}
          CHANGELOG_URL: ${{ inputs.changelog_url }}
          MANUAL_EVIDENCE_URL: ${{ inputs.manual_evidence_url }}
        run: |
          set -euo pipefail
          zip=$(find release-artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)
          [[ -n "$zip" ]] || { echo 'Verified ZIP is missing' >&2; exit 1; }
          version=${zip##*/signaturee-win-v}
          version=${version%.zip}
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "Tag $RELEASE_TAG does not match ZIP version $version" >&2
            exit 1
          }
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          printf 'Stable Windows release from exact commit %s.\n\nReviewed changelog: %s\nManual evidence: %s\n' \
            "$REVISION" "$CHANGELOG_URL" "$MANUAL_EVIDENCE_URL" > "$notes"
          gh release create "$RELEASE_TAG" "$zip" release-artifacts/SHA256SUMS.txt \
            release-artifacts/build-metadata.txt --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$notes" --repo "$GH_REPO"
