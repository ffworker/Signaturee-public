name: Website checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate static content and publication boundaries
        run: python3 -m unittest discover -s website/tests -v
      - name: Check whitespace
        run: git diff --check
