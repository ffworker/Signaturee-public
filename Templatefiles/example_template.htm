<!doctype html>
<html>
<head>
  <meta charset="windows-1252">
  <title>Example signature</title>
</head>
<body style="margin:0;padding:0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#222;border-collapse:collapse;">
    <tr>
      <td style="padding:0 18px 0 0;vertical-align:top;">
        <strong style="font-size:12pt;">$givenname $sn</strong><br>
        <span>$description</span><br>
        <span>$department</span>
      </td>
      <td style="border-left:2px solid #4a7a5b;padding-left:18px;vertical-align:top;">
        <strong>Example Organization</strong><br>
        Tel: $telephonenumber<br>
        Mobil: $mobile<br>
        E-Mail: <a href="mailto:$mail">$mail</a>
      </td>
    </tr>
  </table>
</body>
</html>
